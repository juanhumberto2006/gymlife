<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reservas | GymLife Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="admin-body">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-dumbbell" style="color:var(--primary);"></i> GymLife
        </div>
        <ul class="sidebar-menu">
            <li><a th:href="@{/admin}"><i class="fas fa-home"></i> INICIO</a></li>
            <li><a th:href="@{/admin/usuarios}"><i class="fas fa-users"></i> USUARIOS</a></li>
            <li><a th:href="@{/admin/reservas}" class="active"><i class="fas fa-calendar-check"></i> RESERVAS</a></li>
            <li><a th:href="@{/logout}"><i class="fas fa-sign-out-alt"></i> SALIR</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
        <header class="admin-topbar">
            <div style="font-weight:700;font-size:18px;">RESERVAS <span style="font-weight:400;color:#999;font-size:14px;">> GESTIÓN</span></div>
            <div style="display:flex;align-items:center;gap:10px;">
                <div style="position:relative;">
                    <a href="#" onclick="document.getElementById('admin-logout-dropdown').style.display = document.getElementById('admin-logout-dropdown').style.display === 'block' ? 'none' : 'block'; return false;" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;">
                        <div style="width:35px;height:35px;border-radius:50%;background:#ff5722;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;">A</div>
                        <span style="font-size:14px;font-weight:600;" th:text="${#authentication.name}">ADMIN</span>
                    </a>
                    <div id="admin-logout-dropdown" style="display:none;position:absolute;right:0;top:45px;background:white;box-shadow:0 5px 15px rgba(0,0,0,0.1);border-radius:5px;width:150px;overflow:hidden;z-index:100;">
                        <a th:href="@{/logout}" style="display:block;padding:10px 15px;color:#333;text-decoration:none;font-size:14px;">Cerrar sesión</a>
                    </div>
                </div>
            </div>
        </header>

        <div class="admin-content">
            <div class="card-panel">
                <div class="panel-header">
                    <div class="panel-title">Todas las Reservas</div>
                </div>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Usuario</th>
                            <th>Clase</th>
                            <th>Fecha Clase</th>
                            <th>Fecha Reserva</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="reserva : ${reservas}">
                            <td th:text="${reserva.id}">1</td>
                            <td th:text="${reserva.usuario.username}">user</td>
                            <td th:text="${reserva.clase.nombre}">Yoga</td>
                            <td th:text="${#temporals.format(reserva.clase.fechaHora, 'dd MMM HH:mm')}">Date</td>
                            <td th:text="${#temporals.format(reserva.creadaEn, 'dd MMM HH:mm')}">Created</td>
                            <td>
                                <a th:href="@{/admin/reservas/eliminar/{id}(id=${reserva.id})}" class="action-btn btn-delete" onclick="confirmDelete(event, this.href)"><i class="fas fa-trash"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script th:inline="javascript">
        /*<![CDATA[*/
        // Logout Dropdown
        window.onclick = function(event) {
            if (!event.target.closest('a[onclick*="admin-logout-dropdown"]')) {
                var d = document.getElementById('admin-logout-dropdown');
                if (d && d.style.display === 'block') d.style.display = 'none';
            }
        }

        // SweetAlert Delete
        function confirmDelete(e, url) {
            e.preventDefault();
            Swal.fire({
                title: '¿Cancelar Reserva?',
                text: "Esta acción no se puede deshacer.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ff5722',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Sí, cancelar!',
                cancelButtonText: 'Volver'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = url;
                }
            })
        }
        /*]]>*/
    </script>
</body>
</html>
