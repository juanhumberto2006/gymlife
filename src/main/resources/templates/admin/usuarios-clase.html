<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios Clase | GymLife Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="admin-body">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-dumbbell" style="color:var(--primary);"></i> LOGOTYPE
        </div>
        <ul class="sidebar-menu">
            <li><a th:href="@{/admin}" class="active"><i class="fas fa-home"></i> HOME</a></li>
            <li><a th:href="@{/admin/usuarios}"><i class="fas fa-users"></i> USUARIOS</a></li>
            <li><a th:href="@{/admin/reservas}"><i class="fas fa-calendar-check"></i> RESERVAS</a></li>
            <li><a th:href="@{/logout}"><i class="fas fa-sign-out-alt"></i> LOGOUT</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
        <header class="admin-topbar">
            <div style="font-weight:700;font-size:18px;">CLASE <span style="font-weight:400;color:#999;font-size:14px;" th:text="'> ' + ${clase.nombre}">> CLASS</span></div>
            <div style="display:flex;align-items:center;gap:10px;">
                <div style="width:35px;height:35px;border-radius:50%;background:#ff5722;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;">A</div>
                <span style="font-size:14px;font-weight:600;" th:text="${#authentication.name}">ADMIN</span>
            </div>
        </header>

        <div class="admin-content">
            <div class="card-panel">
                <div class="panel-header">
                    <div class="panel-title">Usuarios registrados en <span th:text="${clase.nombre}"></span></div>
                    <a th:href="@{/admin}" class="btn-primary">Volver</a>
                </div>
                <p style="color:#666;margin-bottom:20px;">Fecha: <span th:text="${#temporals.format(clase.fechaHora, 'dd MMM yyyy HH:mm')}"></span></p>
                
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Fecha de Registro</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="reserva : ${reservas}">
                            <td th:text="${reserva.usuario.username}">User</td>
                            <td th:text="${#temporals.format(reserva.creadaEn, 'dd MMM HH:mm')}">Date</td>
                            <td>
                                <a th:href="@{/admin/reservas/eliminar/{id}(id=${reserva.id})}" class="action-btn btn-delete" onclick="return confirm('¿Eliminar reserva de este usuario?');"><i class="fas fa-trash"></i> Quitar</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(reservas)}">
                            <td colspan="3" style="text-align:center;padding:20px;">No hay usuarios registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
