<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios | GymLife Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
        .modal-content { background-color: #fff; margin: 5% auto; padding: 30px; border: none; width: 500px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative; animation: slideIn 0.3s; }
        @keyframes slideIn { from {opacity: 0; transform: translateY(-50px);} to {opacity: 1; transform: translateY(0);} }
        .close { position: absolute; right: 20px; top: 15px; color: #aaa; font-size: 24px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .close:hover { color: #333; }
    </style>
</head>
<body class="admin-body">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-dumbbell" style="color:var(--primary);"></i> GymLife
        </div>
        <ul class="sidebar-menu">
            <li><a th:href="@{/admin}"><i class="fas fa-home"></i> INICIO</a></li>
            <li><a th:href="@{/admin/usuarios}" class="active"><i class="fas fa-users"></i> USUARIOS</a></li>
            <li><a th:href="@{/admin/reservas}"><i class="fas fa-calendar-check"></i> RESERVAS</a></li>
            <li><a th:href="@{/logout}"><i class="fas fa-sign-out-alt"></i> SALIR</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
        <header class="admin-topbar">
            <div style="font-weight:700;font-size:18px;">USUARIOS <span style="font-weight:400;color:#999;font-size:14px;">> GESTIÓN</span></div>
            <div style="display:flex;align-items:center;gap:10px;">
                <div style="position:relative;">
                    <a href="#" onclick="document.getElementById('admin-logout-dropdown').style.display = document.getElementById('admin-logout-dropdown').style.display === 'block' ? 'none' : 'block'; return false;" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;">
                        <div style="width:35px;height:35px;border-radius:50%;background:#ff5722;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;">A</div>
                        <span style="font-size:14px;font-weight:600;" th:text="${#authentication.name}">ADMIN</span>
                    </a>
                    <div id="admin-logout-dropdown" style="display:none;position:absolute;right:0;top:45px;background:white;box-shadow:0 5px 15px rgba(0,0,0,0.1);border-radius:5px;width:150px;overflow:hidden;z-index:100;">
                        <a th:href="@{/logout}" style="display:block;padding:10px 15px;color:#333;text-decoration:none;font-size:14px;">Cerrar sesión</a>
                    </div>
                </div>
            </div>
        </header>

        <div class="admin-content">
            <div class="card-panel">
                <div class="panel-header">
                    <div class="panel-title">Lista de Usuarios</div>
                    <button onclick="openModal()" class="btn-primary"><i class="fas fa-plus"></i> Nuevo Usuario</button>
                </div>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Roles</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${usuarios}">
                            <td th:text="${user.id}">1</td>
                            <td th:text="${user.username}">admin</td>
                            <td>
                                <span th:each="rol : ${user.roles}" th:text="${rol.rol} + ' '" style="background:#eee;padding:2px 5px;border-radius:4px;font-size:11px;margin-right:2px;">ROLE</span>
                            </td>
                            <td>
                                <button class="action-btn btn-edit" 
                                        th:data-id="${user.id}"
                                        th:data-username="${user.username}"
                                        onclick="openModal(this)"><i class="fas fa-pen"></i></button>
                                <a th:href="@{/admin/usuarios/eliminar/{id}(id=${user.id})}" class="action-btn btn-delete" onclick="confirmDelete(event, this.href)"><i class="fas fa-trash"></i></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Modal -->
        <div id="userModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal()">&times;</span>
                <h2 id="modalTitle" style="margin-bottom:20px;color:#333;">Nuevo Usuario</h2>
                <form id="userForm" th:action="@{/admin/usuarios/guardar}" method="post">
                    <input type="hidden" id="userId" name="id" />
                    
                    <div class="form-group" style="margin-bottom:15px;">
                        <label style="display:block;margin-bottom:5px;font-weight:500;">Username</label>
                        <input type="text" id="username" name="username" required style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;" />
                    </div>
                    
                    <div class="form-group" style="margin-bottom:20px;">
                        <label style="display:block;margin-bottom:5px;font-weight:500;">Password <span style="font-size:12px;color:#888;">(Dejar en blanco para mantener)</span></label>
                        <input type="password" id="rawPassword" name="rawPassword" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;" />
                    </div>
                    
                    <div style="text-align:right;">
                        <button type="button" onclick="closeModal()" style="background:#ccc;color:#333;padding:10px 20px;border:none;border-radius:4px;cursor:pointer;margin-right:10px;">Cancelar</button>
                        <button type="submit" style="background:#ff5722;color:white;padding:10px 20px;border:none;border-radius:4px;cursor:pointer;">Guardar</button>
                    </div>
                </form>
            </div>
        </div>

    </main>

    <script th:inline="javascript">
        /*<![CDATA[*/
        // Logout Dropdown
        window.onclick = function(event) {
            if (!event.target.closest('a[onclick*="admin-logout-dropdown"]')) {
                var d = document.getElementById('admin-logout-dropdown');
                if (d && d.style.display === 'block') d.style.display = 'none';
            }
            if (event.target == document.getElementById('userModal')) {
                closeModal();
            }
        }

        // Modal Logic
        function openModal(btn) {
            var modal = document.getElementById('userModal');
            var form = document.getElementById('userForm');
            var title = document.getElementById('modalTitle');
            
            if (btn) {
                // Edit Mode
                title.innerText = 'Editar Usuario';
                document.getElementById('userId').value = btn.getAttribute('data-id');
                document.getElementById('username').value = btn.getAttribute('data-username');
                document.getElementById('rawPassword').value = ''; // Reset password field
            } else {
                // New Mode
                title.innerText = 'Nuevo Usuario';
                form.reset();
                document.getElementById('userId').value = '';
            }
            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('userModal').style.display = 'none';
        }

        // SweetAlert Delete
        function confirmDelete(e, url) {
            e.preventDefault();
            Swal.fire({
                title: '¿Estás seguro?',
                text: "Esta acción no se puede deshacer.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ff5722',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Sí, eliminar!',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = url;
                }
            })
        }
        /*]]>*/
    </script>
</body>
</html>
