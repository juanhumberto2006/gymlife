<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clases | GymLife Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="admin-body">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-dumbbell" style="color:var(--primary);"></i> GymLife
        </div>
        <ul class="sidebar-menu">
            <li><a th:href="@{/admin}"><i class="fas fa-home"></i> INICIO</a></li>
            <li><a th:href="@{/admin/usuarios}"><i class="fas fa-users"></i> USUARIOS</a></li>
            <li><a th:href="@{/admin/reservas}"><i class="fas fa-calendar-check"></i> RESERVAS</a></li>
            <li><a th:href="@{/admin/clases}" class="active"><i class="fas fa-calendar-alt"></i> CLASES</a></li>
            <li><a th:href="@{/logout}"><i class="fas fa-sign-out-alt"></i> SALIR</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
        <header class="admin-topbar">
            <div style="font-weight:700;font-size:18px;">CLASES <span style="font-weight:400;color:#999;font-size:14px;">> GESTIÓN</span></div>
            <div style="display:flex;align-items:center;gap:10px;">
                <div style="position:relative;">
                    <a href="#" onclick="document.getElementById('admin-logout-dropdown').style.display = document.getElementById('admin-logout-dropdown').style.display === 'block' ? 'none' : 'block'; return false;" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;">
                        <div style="width:35px;height:35px;border-radius:50%;background:#ff5722;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;">A</div>
                        <span style="font-size:14px;font-weight:600;" th:text="${#authentication.name}">ADMIN</span>
                    </a>
                    <div id="admin-logout-dropdown" style="display:none;position:absolute;right:0;top:45px;background:white;box-shadow:0 5px 15px rgba(0,0,0,0.1);border-radius:5px;width:150px;overflow:hidden;z-index:100;">
                        <a th:href="@{/logout}" style="display:block;padding:10px 15px;color:#333;text-decoration:none;font-size:14px;">Cerrar sesión</a>
                    </div>
                </div>
            </div>
        </header>

        <div class="admin-content">
            <div class="card-panel">
                <div class="panel-header">
                    <div class="panel-title">Todas las Clases</div>
                    <button class="btn-primary" onclick="openModal(null)">Nueva Clase</button>
                </div>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Capacidad</th>
                            <th>Fecha Hora</th>
                            <th>Reservas</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="clase : ${clases}">
                            <td th:text="${clase.nombre}">Yoga</td>
                            <td th:text="${clase.descripcion}">Clase de yoga</td>
                            <td th:text="${clase.capacidad}">20</td>
                            <td th:text="${#temporals.format(clase.fechaHora, 'dd MMM HH:mm')}">12 Feb 10:00</td>
                            <td>
                                <span th:text="${reservados[clase.id] ?: 0}">0</span>
                                <span class="status-badge" th:classappend="${clase.capacidad - (reservados[clase.id] ?: 0) > 0 ? 'status-success' : 'status-danger'}" th:text="${clase.capacidad - (reservados[clase.id] ?: 0) > 0 ? 'Disponible' : 'Lleno'}">Disponible</span>
                            </td>
                            <td>
                                <a th:href="@{/admin/clases/{id}/usuarios(id=${clase.id})}" class="action-btn btn-view" title="Ver Usuarios"><i class="fas fa-users"></i></a>
                                <button class="action-btn btn-edit" 
                                        th:data-id="${clase.id}"
                                        th:data-nombre="${clase.nombre}"
                                        th:data-descripcion="${clase.descripcion}"
                                        th:data-capacidad="${clase.capacidad}"
                                        th:data-fecha="${clase.fechaHora}"
                                        onclick="openModal(this)" title="Editar"><i class="fas fa-pen"></i></button>
                                <a th:href="@{/admin/clases/eliminar/{id}(id=${clase.id})}" class="action-btn btn-delete" onclick="confirmDelete(event, this.href)" title="Eliminar"><i class="fas fa-trash"></i></a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(clases)}">
                            <td colspan="6" style="text-align:center;padding:20px;">No hay clases registradas.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal para crear/editar clase -->
    <div id="claseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Nueva Clase</h2>
                <span class="close" onclick="closeModal()" style="cursor:pointer;font-size:24px;">&times;</span>
            </div>
            <form th:action="@{/admin/clases/guardar}" method="post" id="claseForm">
                <input type="hidden" id="claseId" name="id" />
                <div class="form-group">
                    <label>Nombre de la Clase</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej. Yoga">
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="descripcion" name="descripcion" required placeholder="Descripción breve"></textarea>
                </div>
                <div class="form-group">
                    <label>Capacidad</label>
                    <input type="number" id="capacidad" name="capacidad" required min="1">
                </div>
                <div class="form-group">
                    <label>Fecha y Hora</label>
                    <input type="datetime-local" id="fechaHora" name="fechaHora" required>
                </div>
                <div style="text-align:right;">
                    <button type="button" onclick="closeModal()" style="background:#ccc;color:#333;padding:10px 20px;border:none;border-radius:4px;cursor:pointer;margin-right:10px;">Cancelar</button>
                    <button type="submit" style="background:#ff5722;color:white;padding:10px 20px;border:none;border-radius:4px;cursor:pointer;">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openModal(btn) {
            const modal = document.getElementById('claseModal');
            const form = document.getElementById('claseForm');
            const title = document.getElementById('modalTitle');
            
            if (btn) {
                // Editar clase existente
                title.textContent = 'Editar Clase';
                document.getElementById('claseId').value = btn.dataset.id;
                document.getElementById('nombre').value = btn.dataset.nombre;
                document.getElementById('descripcion').value = btn.dataset.descripcion;
                document.getElementById('capacidad').value = btn.dataset.capacidad;
                
                if (btn.dataset.fecha) {
                    const fecha = new Date(btn.dataset.fecha);
                    const anio = fecha.getFullYear();
                    const mes = String(fecha.getMonth() + 1).padStart(2, '0');
                    const dia = String(fecha.getDate()).padStart(2, '0');
                    const horas = String(fecha.getHours()).padStart(2, '0');
                    const minutos = String(fecha.getMinutes()).padStart(2, '0');
                    document.getElementById('fechaHora').value = `${anio}-${mes}-${dia}T${horas}:${minutos}`;
                    form.action = '/admin/clases/editar/' + btn.dataset.id;
                }
            } else {
                // Nueva clase
                title.textContent = 'Nueva Clase';
                form.reset();
                form.action = '/admin/clases/guardar';
            }
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('claseModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('claseModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        function confirmDelete(event, url) {
            if (!confirm('¿Estás seguro de que deseas eliminar esta clase? También se eliminarán todas las reservas asociadas.')) {
                event.preventDefault();
            }
        }

        // SweetAlert para mensajes flash
        document.addEventListener('DOMContentLoaded', function() {
            const mensaje = /*[[${mensaje}]]*/ null;
            const error = /*[[${error}]]*/ null;
            
            if (mensaje) {
                Swal.fire({
                    title: 'Éxito',
                    text: mensaje,
                    icon: 'success',
                    confirmButtonColor: '#ff5722'
                });
            }
            if (error) {
                Swal.fire({
                    title: 'Error',
                    text: error,
                    icon: 'error',
                    confirmButtonColor: '#ff5722'
                });
            }
        });
    </script>
</body>
</html>
