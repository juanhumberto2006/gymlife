<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | GymLife</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="login-page">
    
    <div class="login-container">
        <!-- Left Side: Form -->
        <div class="login-left">
            <a th:href="@{/}" class="brand-logo">GymLife</a>
            
            <h2 class="login-title">BIENVENIDO</h2>
            <p class="login-subtitle">Por favor ingresa tus credenciales</p>
            
            <form th:action="@{/login}" method="post" class="login-form">
                <div class="input-group">
                    <label for="username">Usuario</label>
                    <input id="username" name="username" type="text" placeholder="Ingresa tu usuario" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input id="password" name="password" type="password" placeholder="••••••••" required>
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember-me"> Recordarme
                    </label>
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>
                
                <button type="submit" class="btn-submit">ENTRAR</button>
                
                <div class="register-link">
                    ¿No tienes cuenta? <a th:href="@{/register}">Regístrate aquí</a>
                </div>
            </form>
        </div>
        
        <!-- Right Side: Illustration -->
        <div class="login-right">
            <div class="illustration-content">
                <i class="fas fa-dumbbell fa-5x mb-4"></i>
                <h3>Tu Cuerpo, Tu Templo</h3>
                <p>Únete a la comunidad fitness más grande y alcanza tus metas hoy mismo.</p>
            </div>
            <div class="circle-1"></div>
            <div class="circle-2"></div>
        </div>
    </div>

    <!-- SweetAlert Handling -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            
            if (urlParams.has('error')) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error de Acceso',
                    text: 'Usuario o contraseña incorrectos',
                    confirmButtonColor: '#ff5722'
                });
            }
            
            if (urlParams.has('logout')) {
                Swal.fire({
                    icon: 'success',
                    title: '¡Hasta pronto!',
                    text: 'Has cerrado sesión correctamente',
                    timer: 2000,
                    showConfirmButton: false
                });
            }
        });
        /*]]>*/
    </script>
</body>
</html>
