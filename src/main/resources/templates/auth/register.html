<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | GymLife</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="login-page">
    
    <div class="login-container">
        <!-- Left Side: Form -->
        <div class="login-left">
            <a th:href="@{/}" class="brand-logo">GymLife</a>
            
            <h2 class="login-title">CREAR CUENTA</h2>
            <p class="login-subtitle">Únete a nosotros hoy mismo</p>
            
            <form th:action="@{/register}" method="post" class="login-form">
                <div class="input-group">
                    <label for="username">Usuario</label>
                    <input id="username" name="username" type="text" placeholder="Elige un nombre de usuario" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input id="password" name="password" type="password" placeholder="••••••••" required>
                </div>
                
                <div class="form-options" style="justify-content: flex-end;">
                    <!-- No "Remember me" for register usually, maybe terms check? Keeping simple for now -->
                </div>
                
                <button type="submit" class="btn-submit">REGISTRARME</button>
                
                <div class="register-link">
                    ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión aquí</a>
                </div>
            </form>
        </div>
        
        <!-- Right Side: Illustration -->
        <div class="login-right">
            <div class="illustration-content">
                <i class="fas fa-running fa-5x mb-4"></i>
                <h3>Empieza Tu Viaje</h3>
                <p>El primer paso hacia una versión más fuerte y saludable de ti mismo.</p>
            </div>
            <div class="circle-1"></div>
            <div class="circle-2"></div>
        </div>
    </div>

    <!-- SweetAlert Handling -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', function() {
            var error = /*[[${error}]]*/ null;
            
            if (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error de Registro',
                    text: error,
                    confirmButtonColor: '#ff5722'
                });
            }
        });
        /*]]>*/
    </script>
</body>
</html>
