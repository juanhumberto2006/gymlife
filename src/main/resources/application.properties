# ===========================================
# CONFIGURACIÓN PARA RENDER + SUPABASE
# ===========================================

# Puerto dinámico (Render asigna el puerto)
server.port=${PORT:8080}

# ===========================================
# BASE DE DATOS SUPABASE (Session Pooler)
# ===========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===========================================
# POOL DE CONEXIONES (Optimizado para Supabase)
# ===========================================
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.auto-commit=false

# ===========================================
# JPA / HIBERNATE (Desactivar para arranque rápido)
# ===========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===========================================
# SEGURIDAD (JWT)
# ===========================================
jwt.secret=${JWT_SECRET:mi-secreto-super-seguro-para-desarrollo}
jwt.expiration=86400000

# ===========================================
# LOGS
# ===========================================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR
logging.level.com.gymlife=DEBUG
logging.level.org.springframework.security=DEBUG

# Desactivar banner para arranque más rápido
spring.main.banner-mode=off
