# ===========================================
# CONFIGURACIÓN PARA RENDER + SUPABASE
# ===========================================

# Puerto dinámico (Render asigna el puerto)
server.port=${PORT:8080}

# ===========================================
# BASE DE DATOS SUPABASE (Session Pooler)
# ===========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===========================================
# POOL DE CONEXIONES (HikariCP - Optimizado para Supabase)
# ===========================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ===========================================
# JPA / HIBERNATE
# ===========================================
# 'none' porque ya creaste las tablas manualmente en Supabase
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ===========================================
# SEGURIDAD (JWT si lo usas)
# ===========================================
# Si usas JWT, agrega tu secret key aquí
jwt.secret=${JWT_SECRET:mi-secreto-super-seguro-para-desarrollo}
jwt.expiration=86400000

# ===========================================
# LOGS
# ===========================================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR
logging.level.com.gymlife=DEBUG
